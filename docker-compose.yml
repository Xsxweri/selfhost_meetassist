services:
  db:
    image: pgvector/pgvector:pg16
    container_name: meeting-assistant-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meeting_assistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: meeting-assistant-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata: