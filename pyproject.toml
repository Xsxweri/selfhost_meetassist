[project]
name = "meeting-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Xusixue", email = "1821892081@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "celery[redis]>=5.6.3",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.2",
    "openai>=3.16.2",
    "passlib[bcrypt]>=1.7.4",
    "pgvector>=0.5.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-docx>=1.2.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "redis>=6.4.0",
    "reportlab>=5.0.1",
    "sqlalchemy[asyncio]>=2.0.54",
    "torch>=2.5.1",
    "uvicorn[standard]>=0.53.0",
    "websockets>=17.1",
]

[project.scripts]
meeting-assistant = "meeting_assistant:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
